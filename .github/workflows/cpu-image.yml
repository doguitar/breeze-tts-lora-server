name: Build CPU image

# Builds the CPU image from .devops/breeze_lora_cpu.Dockerfile and runs the
# server's unit tests inside it. Automatic builds run on relevant pushes to
# main; PR-branch image builds require manual workflow_dispatch (select the
# PR head branch in "Run workflow"). The image is pushed to GHCR on non-PR
# events.
#
# Push tags:
#   ghcr.io/<owner>/<repo>:cpu
#   ghcr.io/<owner>/<repo>:cpu-<short-sha>

on:
  push:
    branches: [main]
    paths:
      - "app/breeze_lora_server/**"
      - "src/models/breeze_tts/**"
      - "include/engine/models/breeze_tts/**"
      - "tests/unittests/test_breeze_lora_*.cpp"
      - "CMakeLists.txt"
      - ".devops/breeze_lora_cpu.Dockerfile"
      - ".dockerignore"
      - ".github/workflows/cpu-image.yml"
  workflow_dispatch:

concurrency:
  group: cpu-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  cpu:
    name: CPU image + unit tests
    runs-on: ubuntu-24.04
    # The CPU build compiles the full engine from source; an explicit ceiling
    # turns a stalled build into a timeout (with the diagnostics below) instead
    # of an opaque runner disconnect.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker diagnostics
        run: |
          echo "== host =="
          nproc
          free -m | sed -n '1,2p'
          df -h /
          echo "== docker =="
          docker version
          docker buildx version
          docker info --format 'CPUs={{.NCPU}} MemTotal={{.MemTotal}} Driver={{.Driver}}'

      - name: Compute image tags
        id: meta
        run: echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build CPU image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devops/breeze_lora_cpu.Dockerfile
          target: build
          load: true
          tags: |
            breeze-lora-server:cpu
            breeze-lora-server:cpu-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=cpu
          cache-to: type=gha,mode=max,scope=cpu

      - name: Run breeze-lora unit tests
        run: |
          set -euo pipefail
          for test in \
            /src/build/bin/breeze_lora_math_test \
            /src/build/bin/breeze_lora_manifest_test \
            /src/build/bin/breeze_lora_server_config_test
          do
            echo "== $test"
            docker run --rm --entrypoint "$test" breeze-lora-server:cpu
          done

      - name: Export runtime CPU image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devops/breeze_lora_cpu.Dockerfile
          load: true
          tags: |
            ghcr.io/${{ github.repository }}:cpu
            ghcr.io/${{ github.repository }}:cpu-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=cpu

      - name: Verify runtime image
        run: |
          set -euo pipefail
          tag="ghcr.io/${{ github.repository }}:cpu-${{ steps.meta.outputs.short_sha }}"
          # The runtime stage must actually contain the server and its config;
          # fail here rather than at first deploy.
          docker run --rm --entrypoint /bin/sh "$tag" -c \
            'test -x /app/breeze_lora_server && test -f /app/example.server.json'
          docker image inspect "$tag" --format 'image={{.Id}} size={{.Size}}'

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          docker push "ghcr.io/${{ github.repository }}:cpu"
          docker push "ghcr.io/${{ github.repository }}:cpu-${{ steps.meta.outputs.short_sha }}"
