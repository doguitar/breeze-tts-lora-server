name: Build CUDA image

# Builds two CUDA images from .devops/breeze_lora_cuda.Dockerfile.
#
# One toolkit cannot target both Pascal and Blackwell. CUDA 13 dropped
# sm_60, and CUDA 12.4 cannot compile sm_120. Tags are aliases of those two
# builds so the image name matches the GPU:
#
#   :cuda, :cu128, :turing, :ampere, :ada, :hopper, :blackwell
#     CUDA 12.8, sm_75 and up (120 is rewritten to 120a by CMake)
#   :cu124, :maxwell, :pascal, :volta
#     CUDA 12.4, sm_50/60/61/70. :pascal is the Tesla P100 image.
#
# Automatic builds run on relevant pushes to main; PR-branch image builds
# require manual workflow_dispatch. Unit tests run in the CPU workflow.
# These binaries need a GPU host, so this workflow only builds images.
#
# Each build also pushes :<variant>-<short-sha>.

on:
  push:
    branches: [main]
    paths:
      - "app/breeze_lora_server/**"
      - "src/models/breeze_tts/**"
      - "include/engine/models/breeze_tts/**"
      - "tests/unittests/test_breeze_lora_*.cpp"
      - "CMakeLists.txt"
      - ".devops/breeze_lora_cuda.Dockerfile"
      - ".dockerignore"
      - ".github/workflows/cuda-image.yml"
  workflow_dispatch:

concurrency:
  group: cuda-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  cuda:
    name: CUDA ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cu128
            cuda_version: "12.8.1"
            arches: "75;80;86;89;90;120"
            tags: cuda,cu128,turing,ampere,ada,hopper,blackwell
          - name: cu124
            cuda_version: "12.4.1"
            arches: "50;60;61;70"
            tags: cu124,maxwell,pascal,volta
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker diagnostics
        run: |
          echo "== host =="
          nproc
          free -m | sed -n '1,2p'
          df -h /
          echo "== docker =="
          docker version
          docker buildx version
          docker info --format 'CPUs={{.NCPU}} MemTotal={{.MemTotal}} Driver={{.Driver}}'

      - name: Compute image tags
        id: meta
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY}"
          sha="$(git rev-parse --short=12 HEAD)"
          {
            echo "tags<<EOF"
            IFS=',' read -ra names <<< "${{ matrix.tags }}"
            for name in "${names[@]}"; do
              echo "${repo}:${name}"
            done
            echo "${repo}:${{ matrix.name }}-${sha}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build CUDA image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devops/breeze_lora_cuda.Dockerfile
          build-args: |
            CUDA_VERSION=${{ matrix.cuda_version }}
            CUDA_DOCKER_ARCH=${{ matrix.arches }}
            CUDA_BUILD_JOBS=2
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=cuda-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=cuda-${{ matrix.name }}
          push: ${{ github.event_name != 'pull_request' }}
